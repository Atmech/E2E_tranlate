<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interpreter Console</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --amber: #f59e0b; --amber-dim: #78450a; --amber-bg: #1c1506;
  --blue: #3b82f6; --blue-dim: #1e3a5f; --blue-bg: #060f1c;
  --surface: #111827; --surface2: #1f2937; --border: #374151;
  --text: #f9fafb; --text-dim: #9ca3af; --green: #22c55e;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  font: 14px/1.5 system-ui, -apple-system, sans-serif;
  background: #0a0e17; color: var(--text);
  display: flex; flex-direction: column;
}

/* ── Header ── */
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.conn-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0;
}
.conn-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-pill {
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px; background: var(--surface2); color: var(--text-dim);
}
.status-pill.ws-ok    { background: #052e16; color: #86efac; }
.status-pill.oncall   { background: #1e3a5f; color: #93c5fd; }
.status-pill.ended    { background: #3b0764; color: #c4b5fd; }
.call-timer {
  font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-dim); min-width: 38px;
}
.lang-badges { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.lang-badge {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  padding: 2px 8px; border-radius: 4px;
}
.lang-badge.agent    { background: var(--blue-dim); color: #93c5fd; }
.lang-badge.arrow    { color: var(--text-dim); font-size: 13px; }
.lang-badge.customer { background: var(--amber-dim); color: #fcd34d; }
.rec-pip {
  font-size: 11px; font-weight: 700; color: #fff; background: #dc2626;
  padding: 2px 7px; border-radius: 4px; opacity: 0; transition: opacity 0.1s;
}
.rec-pip.on { opacity: 1; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0.4; } }

/* ── Conversation ── */
main {
  flex: 1; overflow-y: auto; padding: 16px 12px;
  display: flex; flex-direction: column; gap: 12px;
}
.empty-hint {
  margin: auto; color: var(--text-dim); font-size: 15px; text-align: center; line-height: 2;
}
.empty-hint strong { color: var(--text); }

/* Bubbles */
.bubble-row { display: flex; }
.bubble-row.customer { justify-content: flex-start; }
.bubble-row.agent    { justify-content: flex-end; }
.bubble {
  max-width: 68%; border-radius: 12px; padding: 10px 14px;
}
.bubble-row.customer .bubble {
  background: var(--amber-bg); border: 1px solid var(--amber-dim);
  border-bottom-left-radius: 3px;
}
.bubble-row.agent .bubble {
  background: var(--blue-bg); border: 1px solid var(--blue-dim);
  border-bottom-right-radius: 3px;
}
.bubble .blabel {
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 4px; opacity: 0.6;
}
.bubble-row.customer .blabel { color: var(--amber); }
.bubble-row.agent    .blabel { color: var(--blue); }
.bubble .original    { font-size: 14px; line-height: 1.45; }
.bubble .translation { font-size: 12px; color: var(--text-dim); margin-top: 5px; line-height: 1.4; display: none; }
.bubble-row.customer .translation::before { content: '↳ heard: '; color: var(--amber); }
.bubble-row.agent    .translation::before { content: 'heard ↲: '; color: var(--blue); }

/* ── Footer ── */
footer {
  flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px 14px;
}
.footer-top {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.footer-top input {
  background: #0a0e17; color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; min-width: 200px; font-size: 13px;
}
.footer-top button {
  font-size: 13px; padding: 5px 12px; border: 0; border-radius: 6px; cursor: pointer;
}
.btn-start { background: var(--blue); color: #fff; }
.btn-start:disabled { opacity: 0.4; cursor: default; }
.btn-stop { background: #dc2626; color: #fff; }
.btn-stop:disabled { opacity: 0.4; cursor: default; }
.mic-wrap {
  flex: 1; min-width: 80px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.mic-fill {
  height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width 0.05s ease-out;
}
.ptt-row { display: flex; justify-content: center; }
#ptt {
  width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--border);
  background: var(--surface2); color: var(--text-dim);
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  cursor: pointer; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; transition: all 0.1s;
  user-select: none; -webkit-user-select: none;
}
#ptt:disabled { opacity: 0.35; cursor: default; }
#ptt .icon { font-size: 20px; line-height: 1; }
#ptt.live {
  border-color: var(--green); background: #052e16; color: var(--green);
  box-shadow: 0 0 20px rgba(34,197,94,0.3);
}
</style>
</head>
<body>

<header>
  <span class="conn-dot" id="dot"></span>
  <span class="status-pill" id="status-pill">Idle</span>
  <span class="call-timer" id="call-timer"></span>
  <div class="lang-badges">
    <span class="lang-badge agent"    id="badge-agent">??</span>
    <span class="lang-badge arrow">⇄</span>
    <span class="lang-badge customer" id="badge-customer">??</span>
  </div>
  <span class="rec-pip" id="rec-pip">● REC</span>
</header>

<main id="conv">
  <div class="empty-hint" id="hint">
    Dial <strong>5000</strong> to start a call
  </div>
</main>

<footer>
  <div class="footer-top">
    <input id="url" />
    <button class="btn-start" id="start">Start mic</button>
    <button class="btn-stop"  id="stop" disabled>Stop</button>
    <div class="mic-wrap"><div class="mic-fill" id="mic-meter"></div></div>
  </div>
  <div class="ptt-row">
    <button id="ptt" disabled>
      <span class="icon">🎙</span>
      <span>Hold to Talk</span>
    </button>
  </div>
</footer>

<script type="module">
const $ = (id) => document.getElementById(id);

// Auto-derive WS URL from current page host so it works on Render and locally.
const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
$('url').value = `${wsProto}://${location.host}/agent`;

// ── Audio pipeline state (carry-over, untouched) ──
let ws = null, capCtx = null, playCtx = null, workletNode = null, micStream = null;
let playHead = 0;
let talking = false;

// ── UI state ──
let activeCustomerBubble = null; // { el, original, translation } DOM refs
let activeAgentBubble = null;
let callTimerInterval = null;
let callStartTime = 0;
let micRaf = null, pendingMicLevel = 0;

// ── Bubble helpers ──
function hideHint() {
  const h = $('hint');
  if (h) h.remove();
}

function createBubble(side) {
  const conv = $('conv');
  const row = document.createElement('div');
  row.className = 'bubble-row ' + side;
  const label = side === 'customer' ? 'Customer' : 'Agent';
  row.innerHTML =
    `<div class="bubble"><div class="blabel">${label}</div>` +
    `<div class="original"></div><div class="translation"></div></div>`;
  conv.appendChild(row);
  conv.scrollTop = conv.scrollHeight;
  return {
    original:    row.querySelector('.original'),
    translation: row.querySelector('.translation'),
  };
}

function getBubble(side) {
  if (side === 'customer') {
    if (!activeCustomerBubble) activeCustomerBubble = createBubble('customer');
    return activeCustomerBubble;
  }
  if (!activeAgentBubble) activeAgentBubble = createBubble('agent');
  return activeAgentBubble;
}

// The translate model streams continuously and rarely emits a turnComplete on a live
// (never-silent) phone call, so we can't rely on turn-end alone to split bubbles. Finalize
// a side's bubble after a short gap with no new transcript for it. turn-end still finalizes
// immediately when it does fire.
const BUBBLE_IDLE_MS = 1500;
const idleTimers = { customer: null, agent: null };

function finalizeBubble(side) {
  if (side === 'customer') activeCustomerBubble = null;
  else                     activeAgentBubble = null;
}

function bumpIdle(side) {
  if (idleTimers[side]) clearTimeout(idleTimers[side]);
  idleTimers[side] = setTimeout(() => { idleTimers[side] = null; finalizeBubble(side); }, BUBBLE_IDLE_MS);
}

function handleTranscript(who, text) {
  hideHint();
  let bubble, field, side;
  if      (who === 'customer')      { side = 'customer'; field = 'original'; }
  else if (who === 'agent-hears')   { side = 'customer'; field = 'translation'; }
  else if (who === 'agent')         { side = 'agent';    field = 'original'; }
  else if (who === 'customer-hears'){ side = 'agent';    field = 'translation'; }
  else return;
  bubble = getBubble(side);

  const el = bubble[field];
  el.textContent += text;
  if (field === 'translation') el.style.display = '';
  el.dir = 'auto'; // handles RTL languages automatically
  bumpIdle(side);  // restart the pause timer that closes this bubble
  $('conv').scrollTop = $('conv').scrollHeight;
}

function handleTurnEnd(side) {
  if (idleTimers[side]) { clearTimeout(idleTimers[side]); idleTimers[side] = null; }
  finalizeBubble(side);
}

// ── Status / timer ──
function setStatus(state) {
  const pill = $('status-pill');
  pill.className = 'status-pill';
  const map = {
    'ws-ok':  ['ws-ok',  'Connected'],
    'oncall': ['oncall', 'On Call'],
    'ended':  ['ended',  'Call Ended'],
  };
  const [cls, label] = map[state] || [null, 'Idle'];
  if (cls) pill.classList.add(cls);
  pill.textContent = label;
}

function startTimer() {
  callStartTime = Date.now();
  $('call-timer').textContent = '0:00';
  callTimerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - callStartTime) / 1000);
    $('call-timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);
}

function stopTimer() { clearInterval(callTimerInterval); callTimerInterval = null; }

// ── PTT ──
function setTalking(on) {
  if (on === talking) return;
  talking = on;
  $('ptt').classList.toggle('live', on);
  $('rec-pip').classList.toggle('on', on);
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'ptt', active: on }));
}

// ── Mic level (animation-frame throttled) ──
function updateMicLevel(rms) {
  pendingMicLevel = rms;
  if (!micRaf) micRaf = requestAnimationFrame(() => {
    micRaf = null;
    $('mic-meter').style.width = Math.min(100, pendingMicLevel * 300) + '%';
  });
}

// ── Gapless 24kHz playback (verbatim) ──
function scheduleChunk(float32) {
  const buf = playCtx.createBuffer(1, float32.length, 24000);
  buf.copyToChannel(float32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  const now = playCtx.currentTime;
  if (playHead < now) playHead = now + 0.05; // 50ms jitter buffer
  src.start(playHead);
  playHead += buf.duration;
}

function int16B64ToFloat32(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(bytes.buffer);
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  return f32;
}

function float32ToInt16B64(f32) {
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  let bin = '';
  const bytes = new Uint8Array(i16.buffer);
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

const WORKLET = `
class CapProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('cap', CapProcessor);
`;

// ── Start / Stop ──
async function start() {
  const url = $('url').value.trim();
  ws = new WebSocket(url);

  ws.onopen = () => {
    $('dot').classList.add('on');
    setStatus('ws-ok');
    ws.send(JSON.stringify({ type: 'join' }));
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    setStatus('idle');
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'audio') {
      scheduleChunk(int16B64ToFloat32(msg.data));
    } else if (msg.type === 'transcript') {
      handleTranscript(msg.who, msg.text);
    } else if (msg.type === 'config') {
      $('badge-agent').textContent    = (msg.agentLang    || '??').toUpperCase();
      $('badge-customer').textContent = (msg.customerLang || '??').toUpperCase();
    } else if (msg.type === 'call') {
      if (msg.state === 'connected') {
        setStatus('oncall');
        startTimer();
        hideHint();
      } else if (msg.state === 'ended') {
        setStatus('ended');
        stopTimer();
        activeCustomerBubble = null;
        activeAgentBubble = null;
      }
    } else if (msg.type === 'turn-end') {
      handleTurnEnd(msg.side);
    }
  };

  // Playback context @24kHz
  playCtx = new AudioContext({ sampleRate: 24000 });
  await playCtx.resume();
  playHead = 0;

  // Capture context @16kHz (browser resamples mic)
  capCtx = new AudioContext({ sampleRate: 16000 });
  await capCtx.resume();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
  });
  const srcNode = capCtx.createMediaStreamSource(micStream);
  const blobUrl = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await capCtx.audioWorklet.addModule(blobUrl);
  workletNode = new AudioWorkletNode(capCtx, 'cap');

  // Batch worklet frames (128 samples) into ~100ms (1600 @16kHz) chunks
  let acc = new Float32Array(0);
  const CHUNK = 1600;
  workletNode.port.onmessage = (e) => {
    const f = e.data;
    // RMS for mic meter
    let sum = 0;
    for (let i = 0; i < f.length; i++) sum += f[i] * f[i];
    updateMicLevel(Math.sqrt(sum / f.length));

    const merged = new Float32Array(acc.length + f.length);
    merged.set(acc, 0); merged.set(f, acc.length);
    let off = 0;
    while (merged.length - off >= CHUNK) {
      const chunk = merged.subarray(off, off + CHUNK);
      // Only stream mic to the bridge while push-to-talk is held.
      if (talking && ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: 'audio', data: float32ToInt16B64(chunk) }));
      off += CHUNK;
    }
    acc = merged.slice(off);
  };
  // Do NOT connect worklet to destination (avoid hearing own mic)
  srcNode.connect(workletNode);

  $('start').disabled = true;
  $('stop').disabled  = false;
  $('ptt').disabled   = false;
}

function stop() {
  micStream?.getTracks().forEach((t) => t.stop());
  workletNode?.disconnect();
  capCtx?.close();
  playCtx?.close();
  ws?.close();
  setTalking(false);
  stopTimer();
  $('start').disabled = false;
  $('stop').disabled  = true;
  $('ptt').disabled   = true;
  $('mic-meter').style.width = '0';
  setStatus('idle');
}

$('start').onclick = () => start().catch((e) => console.error(e));
$('stop').onclick  = stop;

// Push-to-talk: hold button (mouse/touch) or hold Space.
const pttBtn = $('ptt');
pttBtn.addEventListener('mousedown', () => setTalking(true));
pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTalking(true); }, { passive: false });
window.addEventListener('mouseup',  () => setTalking(false));
pttBtn.addEventListener('touchend', () => setTalking(false));
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && !pttBtn.disabled) { e.preventDefault(); setTalking(true); }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setTalking(false); }
});
</script>
</body>
</html>
