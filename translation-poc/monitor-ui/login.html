<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Call Monitor</title><link rel="stylesheet" href="/monitor/style.css"><script src="/monitor/login.js" defer></script></head>
<body class="login-page"><main class="login-card">
<div class="eyebrow">TRANSLATION OPERATIONS</div><h1>Call Monitor</h1>
<p class="muted">Sign in to inspect live calls and recent issues.</p>
<form id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128" autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
<p id="error" class="error" role="alert"></p><button class="primary" type="submit">Sign in</button></form>
<p class="footnote">Private access · Read-only call monitoring</p></main></body></html>
