[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Behind Docker NAT, Asterisk must advertise the Mac LAN IP in SDP or RTP audio won't flow.
; Replace 192.168.1.31 with your Mac's LAN address (e.g. 192.168.1.20).
external_media_address=192.168.1.31
external_signaling_address=192.168.1.31
local_net=192.168.0.0/16
local_net=10.0.0.0/8

; ---- Customer endpoint 1000 ----
[1000]
type=endpoint
context=demo
disallow=all
allow=ulaw
allow=g722
auth=1000
aors=1000
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[1000]
type=auth
auth_type=userpass
username=1000
password=1234

[1000]
type=aor
max_contacts=1
