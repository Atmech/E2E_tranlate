# Native media WebSocket requires Asterisk 20.16+/21.11+/22.6+/23+.
# Asterisk connects directly to the host bridge at ws://host.docker.internal:8080/media.
# Verify: docker compose exec asterisk asterisk -rx "module show like websocket"
services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: translation-asterisk
    restart: unless-stopped
    # extra_hosts makes host.docker.internal resolve on Linux hosts too (no-op on Mac).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5060:5060/udp"          # SIP signaling
      - "10000-10100:10000-10100/udp"   # RTP media
    volumes:
      - ./pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./websocket_client.conf:/etc/asterisk/websocket_client.conf:ro
