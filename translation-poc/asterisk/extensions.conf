[demo]
; Customer dials 5000 to enter the translation bridge.
; AudioSocket sends the call audio to the Node bridge and plays back what the bridge returns.
; Static UUID (single-call POC). ${SHELL()} is disabled by default (needs live_dangerously),
; and Asterisk has no built-in UUID function, so hardcode a valid UUID here.
exten => 5000,1,Answer()
 same  => n,AudioSocket(815677ea-7b5a-4e3a-a5ec-c3f4629e232d,host.docker.internal:9092)
 same  => n,Hangup()
