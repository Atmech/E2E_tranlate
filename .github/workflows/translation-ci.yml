name: Translation bridge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: translation-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: translation-poc/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
